<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Algorithm Performance Analyzer</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

<div class="container">

<h1>🚀 Sorting Algorithm Performance Analyzer</h1>

<textarea id="numbers"
placeholder="Enter numbers separated by commas"></textarea>

<div class="buttons">

<button onclick="generateRandomArray()">
Generate Random Array
</button>

<button onclick="compareSorts()">
Compare Algorithms
</button>

</div>

<div id="stats"></div>

<div id="result"></div>

<canvas id="chart"></canvas>

</div>

<script src="script.js"></script>

</body>
</html>
